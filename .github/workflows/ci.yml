# Continuous integration of the public repository (issue #194): the data-free
# test suite and the public-safety scan on every push and pull request to main.
# The file is maintained in the private working repository and mirrored with
# the code (tools/sync_public.R there); the job runs only in the public one.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer run for the same branch or pull request cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Data-free tests and safety scan
    # The private repository carries the same file; skip the job there.
    if: github.repository == 'ben-geisler/METIMMOX-1'
    runs-on: ubuntu-latest
    env:
      # renv.lock installs dampack and darthtools from GitHub; the token avoids
      # the anonymous API rate limit.
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # The R version of renv.lock. use-public-rspm also points renv at the
      # Posit Public Package Manager binaries (RENV_CONFIG_REPOS_OVERRIDE).
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.2'
          use-public-rspm: true

      # System libraries of the locked packages: renv::sysreqs() for Ubuntu
      # 24.04, plus harfbuzz, fribidi and tiff for the locked textshaping and
      # ragg, which the package manager serves only as source. javareconf
      # configures the runner's JDK for rJava (needed by xlsx -> survHE ->
      # darthtools).
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libcurl4-openssl-dev \
            libfontconfig1-dev libfreetype6-dev libfribidi-dev libgit2-dev \
            libglpk-dev libharfbuzz-dev libicu-dev libjpeg-dev libnode-dev \
            libpng-dev libssl-dev libtiff-dev libxml2-dev zlib1g-dev
          sudo R CMD javareconf

      # renv is not activated in this repository: the action activates it in
      # the runner's checkout, restores renv.lock and caches the library.
      # "never" saves the cache right after the restore, so a failing test does
      # not discard a cold package build (raise cache-version to start over).
      # RENV_INSTALL_TEST_LOAD: renv's Linux-only test load of each installed
      # package fails for the locked waldo 0.5.2, because the locked glue
      # registers an S3 method for waldo::compare_proxy before waldo's
      # namespace is complete. Nothing here loads waldo (testthat/devtools
      # chain), so the test load is skipped, as renv skips it on Windows.
      - uses: r-lib/actions/setup-renv@v2
        with:
          bypass-cache: never
        env:
          RENV_INSTALL_TEST_LOAD: "FALSE"

      # Tests that need the confidential trial data or caches are skipped.
      - name: Data-free test suite
        run: Rscript tests/run_all.R --no-data

      - name: Public-safety scan
        run: Rscript tests/test_public_safety.R
